<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FFFFFF">
<meta name="robots" content="noindex">
<title>Page Not Found — NISA JEWELLERS</title>
<link rel="icon" href="/images/favicon.png" type="image/png" sizes="96x96">
<link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/images/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Served by Cloudflare Pages for any address that does not exist. Same palette and type as privacy.html.
   Paths are absolute because this page can be shown at any depth (e.g. /a/b/c). */
:root{--ivory:#F7F4EE;--charcoal:#242321;--warm-gray:#6F6A62;--border:#DDD9D1;--font-display:'Cormorant Garamond','Georgia',serif;--font-body:'Jost','Helvetica Neue',Arial,sans-serif;}
*,*::before,*::after{box-sizing:border-box;}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--ivory);color:var(--charcoal);font-family:var(--font-body);font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;}
header{border-top:3px solid var(--charcoal);border-bottom:1px solid var(--border);background:#FFFFFF;}
.wrap{max-width:820px;margin:0 auto;padding:0 20px;}
.head-inner{display:flex;align-items:center;min-height:68px;padding:8px 20px;}
.brand{display:block;line-height:0;}
.brand picture{display:block;line-height:0;}
.brand-logo{display:block;height:46px;width:auto;aspect-ratio:1360/414;}
main{flex:1;display:flex;align-items:center;padding:clamp(48px,8vw,96px) 0;}
.card{text-align:center;}
.code{font-size:11px;font-weight:500;letter-spacing:0.3em;text-transform:uppercase;color:var(--warm-gray);margin:0 0 14px;}
h1{font-family:var(--font-display);font-weight:400;font-size:clamp(34px,6vw,50px);line-height:1.1;margin:0 0 14px;}
p{color:var(--warm-gray);margin:0 auto 30px;max-width:40ch;}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 30px;background:var(--charcoal);color:#FFFFFF;text-decoration:none;font-size:12px;font-weight:500;letter-spacing:0.2em;text-transform:uppercase;}
.btn:hover{background:#3A3835;}
</style>
</head>
<body>
<header>
  <div class="wrap head-inner">
    <a class="brand" href="/" aria-label="NISA JEWELLERS — Home"><img class="brand-logo" src="/images/nisa-jewellers-logo-horizontal-charcoal.svg" width="1360" height="414" alt="NISA JEWELLERS"></a>
  </div>
</header>
<main>
  <div class="wrap card">
    <p class="code">Error 404</p>
    <h1>This page could not be found</h1>
    <p>The link may be old or mistyped. Our full collection is on the home page.</p>
    <a class="btn" href="/">Back to Home</a>
  </div>
</main>
</body>
</html>
